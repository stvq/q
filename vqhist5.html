<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЕГЭ История: Тренажер (XIX)</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #e0e0e6;
            --accent-color: rgba(0,0,0,0.3);
            --accent-hover: rgba(0,0,0,0.3);
            --correct-color: #a3e635; /* Пастельный салатово-зеленый */
            --correct-bg: rgba(163, 230, 53, 0.15);
            --wrong-color: #f87171; /* Пастельный красный */
            --wrong-bg: rgba(248, 113, 113, 0.15);
            --border-color: #2a2a30;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background: 
    linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
    url('https://portal-kultura.ru/archive/%D0%9C%D0%90%D0%9D%D0%98%D0%A4%D0%95%D0%A1%D0%A2/VitteRepin.jpg') no-repeat center center / cover;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h1, h2 {
            text-align: center;
            color: #fff;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            background-color: #242428;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-hover);
        }

        .hidden {
            display: none !important;
        }

        .nav-btn {
            background-color: #242428;
            margin-bottom: 20px;
            padding: 8px 15px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #202024;
            color: #fff;
        }

        .col-num {
            width: 40px;
            text-align: center;
            font-weight: bold;
            background-color: #202024;
        }

        /* ИЗМЕНЕНО: теперь элементы выстраиваются в строку по центру */
        .interactive-zone {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap; /* Чтобы на смартфонах элементы не сжимались, а переносились */
        }

        input[type="text"] {
            background-color: #202024;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 6px;
            letter-spacing: 4px;
            text-align: left;
            width: 175px;
            outline: none;
            box-sizing: border-box;
            height: 48px; /* Одинаковая высота для инпута и кнопок */
        }

        input[type="text"]:focus {
            border-color: var(--accent-hover);
        }

        /* Перенесено ниже инпута и кнопок, чтобы уведомление появлялось отдельной строкой */
        .result-box {
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
        }

        .correct-ans {
            color: var(--correct-color);
            background-color: var(--correct-bg);
            border: 1px solid var(--correct-color);
        }

        .wrong-ans {
            color: var(--wrong-color);
            background-color: var(--wrong-bg);
            border: 1px solid var(--wrong-color);
        }

        .action-btn {
            background-color: var(--accent-color);
            color: #fff;
            padding: 0 30px;
            font-weight: bold;
            height: 48px; /* Одинаковая высота для инпута и кнопок */
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }
/* Обновленная интерактивная зона с поддержкой адаптивности */
.interactive-zone {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-top: 20px;
    flex-wrap: nowrap; /* Гарантирует, что инпут и кнопка останутся в один ряд */
}

/* Адаптивность для мобильных устройств */
@media screen and (max-width: 600px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 15px;
        border-radius: 8px;
    }

    h1 {
        font-size: 22px;
    }

    h2 {
        font-size: 18px;
    }

    /* Уменьшаем шрифты и отступы в таблице, чтобы она не вылезала за экраны смартфонов */
    table {
        font-size: 13px;
        margin: 15px 0;
    }

    th, td {
        padding: 8px 6px;
    }

    .col-num {
        width: 30px;
    }

    /* Делаем кнопки меню на главном экране в одну колонку на маленьких телефонах */
    .menu {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    /* Оптимизация инпута и кнопок под узкие экраны */
    input[type="text"] {
        width: 130px; /* Немного сужаем поле ввода */
        font-size: 16px;
        padding: 12px 10px;
        letter-spacing: 2px;
    }

    .action-btn {
        padding: 0 20px;
        font-size: 14px;
        flex-grow: 1; /* Кнопка займет все оставшееся в ряду место */
    }
}
/* Стили для счетчика правильных ответов */
        .score-counter {
            float: right;
            font-size: 16px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 6px;
            background-color: #202024;
            border: 1px solid var(--border-color);
            transition: color 0.3s ease, border-color 0.3s ease;
        }



/* Эффект наведения для кликабельных элементов справа */
        .clickable-right:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
    </style>
</head>

    people: [
        { left: "Первый летописный правитель Киевской Руси; объединил Киев и Новгород в 882 году, совершил успешные походы на Царьград.", right: "Князь Олег Вещий" },

        { left: "Первый венчанный русский царь; провел реформы Избранной рады, присоединил Казанское и Астраханское ханства, ввел опричнину.", right: "Иван IV Грозный" },
        { left: "Глава Русской церкви в середине XVI века; венчал Ивана IV на царство, руководил составлением «Великих Четьих-Миней» и Стоглавым собором.", right: "Митрополит Макарий" },
        { left: "Первый царь из династии Романовых (1613–1645); избран Земским собором, преодолел последствия Смуты, заключил Столбовский мир со Швецией.", right: "Михаил Федорович" },
        { left: "Русский царь (1645–1676), прозван Тишайшим; при нем принято Соборное уложение 1649 г., произошел церковный раскол и Медный бунт.", right: "Алексей Михайлович" },
        { left: "Глава Русской православной церкви при Алексее Михайловиче; провел церковную реформу по исправлению книг, вызвавшую старообрядческий раскол.", right: "Патриарх Никон" },
        { left: "Священник, писатель; лидер старообрядцев и главный противник церковной реформы Никона, сожжен на костре за свои убеждения.", right: "Протопоп Аввакум" },
        { left: "Донской казак, атаман; руководитель крупнейшего казацко-крестьянского восстания в Поволжье (1667–1671), казнен на Красной площади.", right: "Степан Разин" },
        { left: "Первый российский император (1682–1725); реформатор, прорубил «окно в Европу», создал регулярную армию, флот, Сенат и коллегии.", right: "Петр I Великий" },
        { left: "Сподвижник Петра I, генералиссимус; герой Северной войны, фаворит Екатерины I, фактически правил государством в 1725–1727 годах.", right: "А. Д. Меншиков" },
        { left: "Российская императрица (1730–1740); разорвала «Кондиции» верховников, время ее правления называют засильем иностранцев («бироновщина»).", right: "Анна Иоанновна" },
        { left: "Фаворит императрицы Анны Иоанновны, курляндский герцог; сосредоточил в своих руках огромную власть, символ эпохи 1730-х годов.", right: "Э. И. Бирон" },
        { left: "Дочь Петра I, императрица (1741–1761); пришла к власти в ходе переворота, отменила смертную казнь, восстановила Сенат, основала МГУ.", right: "Елизавета Петровна" },
        { left: "Великий ученый-энциклопедист; совершил открытия в физике, химии, астрономии, реформировал русский язык, инициатор создания МГУ.", right: "М. В. Ломоносов" },
        { left: "Императрица (1762–1796); проводила политику «просвещенного абсолютизма», расширила права дворян, успешно воевала с Турцией.", right: "Екатерина II Великая" },
        { left: "Донской казак; предводитель грандиозного крестьянского восстания (1773–1775), выдавал себя за чудом спасшегося императора Петра III.", right: "Емельян Пугачев" },
        { left: "Государственный деятель, фаворит Екатерины II; руководил освоением Новороссии, присоединением Крыма к России, создал Черноморский флот.", right: "Г. А. Потемкин" },
        { left: "Выдающийся полководец, генерал-фельдмаршал; одержал блестящие победы над турками при Ларге и Кагуле (1770) в Русско-турецкой войне.", right: "П. А. Румянцев" },
        { left: "Великий полководец, не проигравший ни одного сражения; взял считавшуюся неприступной крепость Измаил (1790), автор книги «Наука побеждать».", right: "А. В. Суворов" },
        { left: "Знаменитый адмирал; создатель новой тактики парусного флота, одержал победы над турками у мыса Калиакрия и Фидониси, не потерял ни одного корабля.", right: "Ф. Ф. Ушаков" },
        { left: "Писатель, мыслитель-диссидент; автор книги «Путешествие из Петербурга в Москву», за резкую критику крепостничества сослан Екатериной II в Сибирь.", right: "А. N. Радищев" },
        { left: "Просветитель, журналист, издатель; выпускал сатирические журналы «Трутень» и «Живописец», вел полемику с Екатериной II, был заточен в крепость.", right: "Н. И. Новиков" },
        { left: "Государственный деятель, меценат; фаворит Елизаветы Петровны, первый куратор Московского университета, основатель Академии художеств.", right: "И. И. Шувалов" },
        { left: "Российский император (1796–1801), изменил закон о престолонаследии, ограничил дворянские привилегии, убит в ходе заговора.", right: "Павел I" },
        { left: "Российский император (1801–1825), провел министерскую реформу, победил Наполеона, даровал конституцию Польше, в конце правления перешел к консерватизму.", right: "Александр I" },

        { left: "Генерал, командующий 2-й армией в 1812 г.; защищал Багратионовы флеши на Бородинском поле, где был смертельно ранен.", right: "П. И. Багратион" },
        { left: "Поэт и офицер; один из главных организаторов и руководителей партизанского движения во время Отечественной войны 1812 года.", right: "Денис Давыдов" },
        { left: "Знаменитый адмирал; разгромил турецкий флот в Синопском сражении (1853), руководил героической обороной Севастополя, погиб на Малаховом кургане.", right: "П. С. Нахимов" },
        { left: "Вице-адмирал; организатор и первый руководитель обороны Севастополя в Крымской войне, погиб на Малаховом кургане в первый день бомбардировки.", right: "В. А. Корнилов" },
        { left: "Выдающийся военный инженер; руководил возведением оборонительных укреплений Севастополя в Крымской войне и осадой Плевны в 1877 году.", right: "Э. И. Тотлебен" },

        { left: "Генерал-лейтенант; военный инженер, душа сухопутной обороны крепости Порт-Артур в 1904 году, погиб при обстреле форта.", right: "Р. И. Кондратенко" },
        { left: "Вице-адмирал; командовал 2-й Тихоокеанской эскадрой, потерпевшей сокрушительное поражение от японцев в Цусимском сражении (1905).", right: "З. П. Рожественский" },
        { left: "Генерал, командующий 2-й армией в Восточно-Прусской операции 1914 г.; окружен немцами под Танненбергом, покончил жизнь самоубийством.", right: "A. В. Самсонов" },
        { left: "Члены Негласного комитета; близкие друзья Александра I, разрабатывали проекты реформ в начале его правления.", right: "П. А. Строганов, Н. Н. Новосильцев, В. П. Кочубей, А. А. Чарторыйский" },
        { left: "Выдающийся государственный деятель; подготовил проект реформ «Введение к уложению государственных законов» (1809), руководил кодификацией законов при Николае I.", right: "М. М. Сперанский" },
        { left: "Доверенное лицо Александра I; реорганизовал артиллерию, руководил созданием и внедрением военных поселений («аракчеевщина»).", right: "А. А. Аракчеев" },
        { left: "Граф, генерал; первый шеф Третьего отделения Собственной Е.И.В. канцелярии и главный начальник корпуса жандармов при Николае I.", right: "А. Х. Бенкендорф" },
        { left: "Великий хирург, анатом; основоположник военно-полевой хирургии, впервые применил эфирный наркоз и гипс в полевых условиях во время Крымской войны.", right: "Н. И. Пирогов" },
        { left: "Великий химик; открыл Периодический закон химических элементов (1869), написал фундаментальный труд «Основы химии».", right: "Д. И. Менделеев" },

    let currentMode = '';
    let currentCorrectAnswer = '';
    let totalDigits = 0;
    let correctDigits = 0;
    
    // Массив букв расширен до 9 элементов (А-К)
    const letters = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Ж', 'З', 'И'];

    function startTest(mode) {
        currentMode = mode;
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('test-screen').classList.remove('hidden');
        
        let titles = {
            dates: "Раздел 1. События и даты",
            people: "Раздел 2. Деяния и личности",
            facts: "Раздел 3. Процессы и факты",
            geo: "Раздел 4. Описания и географические объекты"
        };
        document.getElementById('test-title').innerText = titles[mode];
        
        totalDigits = 0;
        correctDigits = 0;
        document.getElementById('accuracy-counter').innerText = '0%';
        document.getElementById('accuracy-counter').style.color = '#f87171';
        
        // Инструкция адаптирована под 9 элементов (А-К) и (1-9)
        document.querySelector('#test-screen p').innerText = "Сопоставьте элементы левой колонки (А-К) с элементами правой колонки (1-9). Введите цифры по порядку без пробелов.";
        document.getElementById('user-answer').maxLength = 9; // Ограничение в 9 символов
        document.getElementById('user-answer').placeholder = ". . . . . . . . ."; // Девять точек
        
        generateQuestion();
    }

    function toMainMenu() {
        document.getElementById('test-screen').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function generateQuestion() {
        document.getElementById('user-answer').value = '';
        document.getElementById('user-answer').disabled = false;
        document.getElementById('user-answer').style.borderColor = 'var(--border-color)';
        document.getElementById('result').classList.add('hidden');
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');

        let pool = [...db[currentMode]];
        if (pool.length < 9) return; // Проверка, что элементов в базе хватает на 9 строк

        let selected = [];
        // Набираем 9 уникальных элементов
        while(selected.length < 9) {
            let randIndex = Math.floor(Math.random() * pool.length);
            let item = pool[randIndex];
            if(!selected.some(s => s.right.trim() === item.right.trim())) {
                selected.push(item);
                pool.splice(randIndex, 1);
            }
        }

        let rightColumn = selected.map((item, index) => ({ text: item.right, originalIndex: index }));
        shuffle(rightColumn);

        let answers = [];
        // Формируем правильный ответ из 9 цифр
        for (let i = 0; i < 9; i++) {
            let correctPos = rightColumn.findIndex(item => item.originalIndex === i);
            answers.push(correctPos + 1);
        }
        currentCorrectAnswer = answers.join('');

        let html = '';
        // Генерируем 9 строк таблицы
        for (let i = 0; i < 9; i++) {
            let displayText = selected[i].left;
            
            let factsArray = displayText.split(';').map(f => f.trim()).filter(f => f.length > 0);
            if (factsArray.length > 0) {
                let randomFactIndex = Math.floor(Math.random() * factsArray.length);
                displayText = factsArray[randomFactIndex];
                displayText = displayText.charAt(0).toUpperCase() + displayText.slice(1);
            }

            html += `
                <tr>
                    <td class="col-num">${letters[i]}</td>
                    <td>${displayText}</td>
                    <td class="col-num">${i + 1}</td>
                    <td class="clickable-right" data-num="${i + 1}" onclick="appendNumber(${i + 1})" style="cursor: pointer;">${rightColumn[i].text}</td>
                </tr>
            `;
        }
        document.getElementById('table-body').innerHTML = html;
    }

    function checkAnswer() {
        let userAns = document.getElementById('user-answer').value.trim();
        let resultBox = document.getElementById('result');
        let inputField = document.getElementById('user-answer');

        // Проверяем, что введено ровно 9 цифр
        if (userAns.length !== 9 || isNaN(userAns)) {
            alert('Пожалуйста, введите 9 цифр соответствия без пробелов (например: 123456789)');
            return;
        }

        resultBox.classList.remove('hidden');
        inputField.disabled = true;

        // Счетчик процентов адаптирован под 9 цифр за один раунд
        for (let i = 0; i < 9; i++) {
            totalDigits++;
            if (userAns[i] === currentCorrectAnswer[i]) {
                correctDigits++;
            }
        }

        let percentage = Math.round((correctDigits / totalDigits) * 100);
        let counterEl = document.getElementById('accuracy-counter');
        counterEl.innerText = `${percentage}%`;

        if (percentage < 50) { counterEl.style.color = '#f87171'; } 
        else if (percentage < 75) { counterEl.style.color = '#fb923c'; } 
        else if (percentage < 80) { counterEl.style.color = '#facc15'; } 
        else if (percentage < 90) { counterEl.style.color = '#4ade80'; } 
        else if (percentage < 100) { counterEl.style.color = '#0aa370'; } 
        else { counterEl.style.color = '#38bdf8'; }

        if (userAns === currentCorrectAnswer) {
            resultBox.className = "result-box correct-ans";
            resultBox.innerText = "Правильно! Великолепно.";
            inputField.style.borderColor = "var(--correct-color)";
        } else {
            resultBox.className = "result-box wrong-ans";
            resultBox.innerText = `Неверно. Правильный ответ: ${currentCorrectAnswer}`;
            inputField.style.borderColor = "var(--wrong-color)";
        }

        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function appendNumber(num) {
        let inputField = document.getElementById('user-answer');
        if (inputField.disabled) return;
        
        // Лимит ввода увеличен до 9 символов
        if (inputField.value.length < 9) {
            inputField.value += num;
        }
    }
