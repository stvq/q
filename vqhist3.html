<html lang="ru">
<head>

    <title>ЕГЭ История: Тренажер (XVI-XVII)</title>
    <style>
        :root {

            --correct-bg: rgba(163, 230, 53, 0.15);

            --wrong-bg: rgba(248, 113, 113, 0.15);
            --border-color: #2a2a30;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background: 
    linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
    url('https://alternathistory.ru/wp-content/uploads/2020/03/P1.4.Moskovskij-Kreml-17-veka.jpg') no-repeat center center / cover;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h1, h2 {
            text-align: center;
            color: #fff;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            background-color: #242428;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-hover);
        }

        .hidden {
            display: none !important;
        }

        .nav-btn {
            background-color: #242428;
            margin-bottom: 20px;
            padding: 8px 15px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #202024;
            color: #fff;
        }

        .col-num {
            width: 40px;
            text-align: center;
            font-weight: bold;
            background-color: #202024;
        }

        /* ИЗМЕНЕНО: теперь элементы выстраиваются в строку по центру */
        .interactive-zone {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap; /* Чтобы на смартфонах элементы не сжимались, а переносились */
        }

        input[type="text"] {
            background-color: #202024;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 6px;
            letter-spacing: 4px;
            text-align: left;
            width: 150px;
            outline: none;
            box-sizing: border-box;
            height: 48px; /* Одинаковая высота для инпута и кнопок */
        }

        input[type="text"]:focus {
            border-color: var(--accent-hover);
        }

        /* Перенесено ниже инпута и кнопок, чтобы уведомление появлялось отдельной строкой */
        .result-box {
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
        }

        .correct-ans {
            color: var(--correct-color);
            background-color: var(--correct-bg);
            border: 1px solid var(--correct-color);
        }

        .wrong-ans {
            color: var(--wrong-color);
            background-color: var(--wrong-bg);
            border: 1px solid var(--wrong-color);
        }

        .action-btn {
            background-color: var(--accent-color);
            color: #fff;
            padding: 0 30px;
            font-weight: bold;
            height: 48px; /* Одинаковая высота для инпута и кнопок */
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }
/* Обновленная интерактивная зона с поддержкой адаптивности */
.interactive-zone {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-top: 20px;
    flex-wrap: nowrap; /* Гарантирует, что инпут и кнопка останутся в один ряд */
}

/* Адаптивность для мобильных устройств */
@media screen and (max-width: 600px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 15px;
        border-radius: 8px;
    }

    h1 {
        font-size: 22px;
    }

    h2 {
        font-size: 18px;
    }

    /* Уменьшаем шрифты и отступы в таблице, чтобы она не вылезала за экраны смартфонов */
    table {
        font-size: 13px;
        margin: 15px 0;
    }

    th, td {
        padding: 8px 6px;
    }

    .col-num {
        width: 30px;
    }

    /* Делаем кнопки меню на главном экране в одну колонку на маленьких телефонах */
    .menu {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    /* Оптимизация инпута и кнопок под узкие экраны */
    input[type="text"] {
        width: 100px; /* Немного сужаем поле ввода */
        font-size: 16px;
        padding: 12px 10px;
        letter-spacing: 2px;
    }

    .action-btn {
        padding: 0 20px;
        font-size: 14px;
        flex-grow: 1; /* Кнопка займет все оставшееся в ряду место */
    }
}
/* Стили для счетчика правильных ответов */
        .score-counter {

            font-size: 16px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 6px;
            background-color: #202024;
            border: 1px solid var(--border-color);
            transition: color 0.3s ease, border-color 0.3s ease;
        }



/* Эффект наведения для кликабельных элементов справа */
        .clickable-right:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
    </style>
</head>

        { left: "подписание мирного договора со Швецией, лишившего Россию побережья Балтики — 1610-е", right: "Деревня Столбово" },
        { left: "заключение тяжелого перемирия с Речью Посполитой, уступка Смоленска и Чернигова — 1610-е", right: "Село Деулино" },
        { left: "подписание мира по итогам Смоленской войны, отказ Владислава от претензий на трон — 1630-е", right: "Поляновка (река)" },
        { left: "героическая оборона крепости донскими казаками от огромной турецкой армии — 1630–1640-е", right: "Крепость Азов" },
        { left: "открытие Семеном Дежневым пролива, отделяющего Евразию от Америки — 1640-е", right: "Мыс Дежнева (Чукотский нос)" },
        { left: "вспышка мощного Соляного бунта из-за резкого повышения пошлин на соль — 1640-е", right: "Москва" },
        { left: "проведение генеральной рады украинского казачества, присягнувшего на верность русскому царю — 1650-е", right: "Переяславль" },
        { left: "Медный бунт, жестоко подавленный царскими войсками в Коломенском — 1660-е", right: "Москва" },
        { left: "заключение перемирия, официально вернувшего России Смоленск и Киев — 1667-й", right: "Деревня Андрусово" },
        { left: "вооруженное восстание и 8-летняя оборона монастыря монахами-старообрядцами — 1660–1670-е", right: "Соловецкие острова" },
        { left: "героическая оборона крепости от турецко-крымских войск в ходе войны — 1670-е", right: "Чигирин" },
        { left: "подписание первого мирного договора России с Цинским Китаем на Амуре — 1689-й", right: "Нерчинск" }
    ]
};

    let currentMode = '';
    let currentCorrectAnswer = '';
    let totalDigits = 0;
    let correctDigits = 0;
    // Расширили массив букв до 7 элементов (А-Ж)
    const letters = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Ж'];

    function startTest(mode) {
        currentMode = mode;
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('test-screen').classList.remove('hidden');
        
        let titles = {
            dates: "Раздел 1. События и даты",
            people: "Раздел 2. Деяния и личности",
            facts: "Раздел 3. Процессы и факты",
            geo: "Раздел 4. Описания и географические объекты"
        };
        document.getElementById('test-title').innerText = titles[mode];
        
        totalDigits = 0;
        correctDigits = 0;
        document.getElementById('accuracy-counter').innerText = '0%';
        document.getElementById('accuracy-counter').style.color = '#f87171';
        
        // Поменяли инструкцию на (А-Ж) и (1-7)
        document.querySelector('#test-screen p').innerText = "Сопоставьте элементы левой колонки (А-Ж) с элементами правой колонки (1-7). Введите цифры по порядку без пробелов.";
        document.getElementById('user-answer').maxLength = 7; // Ограничение в 7 символов
        document.getElementById('user-answer').placeholder = ". . . . . . ."; // Семь точек
        
        generateQuestion();
    }

    function toMainMenu() {
        document.getElementById('test-screen').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function generateQuestion() {
        document.getElementById('user-answer').value = '';
        document.getElementById('user-answer').disabled = false;
        document.getElementById('user-answer').style.borderColor = 'var(--border-color)';
        document.getElementById('result').classList.add('hidden');
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');

        let pool = [...db[currentMode]];
        if (pool.length < 7) return; // Проверка, что элементов в базе хватает на 7 строк

        let selected = [];
        // Набираем 7 уникальных элементов
        while(selected.length < 7) {
            let randIndex = Math.floor(Math.random() * pool.length);
            let item = pool[randIndex];
            if(!selected.some(s => s.right.trim() === item.right.trim())) {
                selected.push(item);
                pool.splice(randIndex, 1);
            }
        }

        let rightColumn = selected.map((item, index) => ({ text: item.right, originalIndex: index }));
        shuffle(rightColumn);

        let answers = [];
        // Формируем правильный ответ из 7 цифр
        for (let i = 0; i < 7; i++) {
            let correctPos = rightColumn.findIndex(item => item.originalIndex === i);
            answers.push(correctPos + 1);
        }
        currentCorrectAnswer = answers.join('');

        let html = '';
        // Генерируем 7 строк таблицы
        for (let i = 0; i < 7; i++) {
            let displayText = selected[i].left;
            
            if (currentMode === 'people') {
                let factsArray = displayText.split(';').map(f => f.trim()).filter(f => f.length > 0);
                if (factsArray.length > 0) {
                    let randomFactIndex = Math.floor(Math.random() * factsArray.length);
                    displayText = factsArray[randomFactIndex];
                    displayText = displayText.charAt(0).toUpperCase() + displayText.slice(1);
                }
            }

            html += `
                <tr>
                    <td class="col-num">${letters[i]}</td>
                    <td>${displayText}</td>
                    <td class="col-num">${i + 1}</td>
                    <td class="clickable-right" data-num="${i + 1}" onclick="appendNumber(${i + 1})" style="cursor: pointer;">${rightColumn[i].text}</td>
                </tr>
            `;
        }
        document.getElementById('table-body').innerHTML = html;
    }

    function checkAnswer() {
        let userAns = document.getElementById('user-answer').value.trim();
        let resultBox = document.getElementById('result');
        let inputField = document.getElementById('user-answer');

        // Проверяем, что введено ровно 7 цифр
        if (userAns.length !== 7 || isNaN(userAns)) {
            alert('Пожалуйста, введите 7 цифр соответствия без пробелов (например: 1234567)');
            return;
        }

        resultBox.classList.remove('hidden');
        inputField.disabled = true;

        // Считаем проценты по всем 7 цифрам
        for (let i = 0; i < 7; i++) {
            totalDigits++;
            if (userAns[i] === currentCorrectAnswer[i]) {
                correctDigits++;
            }
        }

        let percentage = Math.round((correctDigits / totalDigits) * 100);
        let counterEl = document.getElementById('accuracy-counter');
        counterEl.innerText = `${percentage}%`;

        if (percentage < 50) { counterEl.style.color = '#f87171'; } 
        else if (percentage < 75) { counterEl.style.color = '#fb923c'; } 
        else if (percentage < 80) { counterEl.style.color = '#facc15'; } 
        else if (percentage < 90) { counterEl.style.color = '#4ade80'; } 
        else if (percentage < 100) { counterEl.style.color = '#0aa370'; } 
        else { counterEl.style.color = '#38bdf8'; }

        if (userAns === currentCorrectAnswer) {
            resultBox.className = "result-box correct-ans";
            resultBox.innerText = "Правильно! Великолепно.";
            inputField.style.borderColor = "var(--correct-color)";
        } else {
            resultBox.className = "result-box wrong-ans";
            resultBox.innerText = `Неверно. Правильный ответ: ${currentCorrectAnswer}`;
            inputField.style.borderColor = "var(--wrong-color)";
        }

        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    // Функция добавления цифр при клике на правую колонку
    function appendNumber(num) {
        let inputField = document.getElementById('user-answer');
        if (inputField.disabled) return;
        
        // Лимит ввода увеличен до 7 символов
        if (inputField.value.length < 7) {
            inputField.value += num;
        }
    }
</script>
