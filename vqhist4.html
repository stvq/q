<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЕГЭ История: Тренажер (XVIII)</title>
    <style>
        :root {
            --bg-color: #121214;

            --text-color: #e0e0e6;
            --accent-color: rgba(0,0,0,0.3);
            --accent-hover: rgba(0,0,0,0.3);
            --correct-color: #a3e635; /* Пастельный салатово-зеленый */
            --correct-bg: rgba(163, 230, 53, 0.15);
            --wrong-color: #f87171; /* Пастельный красный */
            --wrong-bg: rgba(248, 113, 113, 0.15);
            --border-color: #2a2a30;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background: 
    linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
    url('https://img-fotki.yandex.ru/get/1022004/86441892.f6d/0_14b42d_e3b072ce_orig.jpg') no-repeat center center / cover;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h1, h2 {
            text-align: center;
            color: #fff;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            background-color: #242428;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-hover);
        }

        .hidden {
            display: none !important;
        }

        .nav-btn {
            background-color: #242428;
            margin-bottom: 20px;
            padding: 8px 15px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #202024;
            color: #fff;
        }

        .col-num {
            width: 40px;
            text-align: center;
            font-weight: bold;
            background-color: #202024;
        }

        /* ИЗМЕНЕНО: теперь элементы выстраиваются в строку по центру */
        .interactive-zone {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap; /* Чтобы на смартфонах элементы не сжимались, а переносились */
        }

        input[type="text"] {
            background-color: #202024;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 6px;
            letter-spacing: 4px;
            text-align: left;
            width: 175px;
            outline: none;
            box-sizing: border-box;
            height: 48px; /* Одинаковая высота для инпута и кнопок */
        }

        input[type="text"]:focus {
            border-color: var(--accent-hover);
        }

        /* Перенесено ниже инпута и кнопок, чтобы уведомление появлялось отдельной строкой */
        .result-box {
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
        }

        .correct-ans {
            color: var(--correct-color);
            background-color: var(--correct-bg);
            border: 1px solid var(--correct-color);
        }

        .wrong-ans {
            color: var(--wrong-color);
            background-color: var(--wrong-bg);
            border: 1px solid var(--wrong-color);
        }

        .action-btn {
            background-color: var(--accent-color);
            color: #fff;
            padding: 0 30px;
            font-weight: bold;
            height: 48px; /* Одинаковая высота для инпута и кнопок */
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }
/* Обновленная интерактивная зона с поддержкой адаптивности */
.interactive-zone {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-top: 20px;
    flex-wrap: nowrap; /* Гарантирует, что инпут и кнопка останутся в один ряд */
}

/* Адаптивность для мобильных устройств */
@media screen and (max-width: 600px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 15px;
        border-radius: 8px;
    }

    h1 {
        font-size: 22px;
    }

    h2 {
        font-size: 18px;
    }

    /* Уменьшаем шрифты и отступы в таблице, чтобы она не вылезала за экраны смартфонов */
    table {
        font-size: 13px;
        margin: 15px 0;
    }

    th, td {
        padding: 8px 6px;
    }

    .col-num {
        width: 30px;
    }

    /* Делаем кнопки меню на главном экране в одну колонку на маленьких телефонах */
    .menu {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    /* Оптимизация инпута и кнопок под узкие экраны */
    input[type="text"] {
        width: 130px; /* Немного сужаем поле ввода */
        font-size: 16px;
        padding: 12px 10px;
        letter-spacing: 2px;
    }

    .action-btn {
        padding: 0 20px;
        font-size: 14px;
        flex-grow: 1; /* Кнопка займет все оставшееся в ряду место */
    }
}
/* Стили для счетчика правильных ответов */
        .score-counter {
            float: right;
            font-size: 16px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 6px;
            background-color: #202024;
            border: 1px solid var(--border-color);
            transition: color 0.3s ease, border-color 0.3s ease;
        }



/* Эффект наведения для кликабельных элементов справа */
        .clickable-right:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
    </style>
</head>

        { left: "Разгром турецкого флота адмиралом Ф. Ф. Ушаковым, завершивший войну 1787–1791 гг.", right: "Мыс Калиакрия" },
        { left: "Ключевая турецкая твердыня, взятая после долгой осады войсками Г. Потемкина в 1788 году", right: "Крепость Очаков" }

};

    let currentMode = '';
    let currentCorrectAnswer = '';
    let totalDigits = 0;
    let correctDigits = 0;
    
    // Массив букв расширен до 8 элементов (А-И)
    const letters = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Ж', 'И'];

    function startTest(mode) {
        currentMode = mode;
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('test-screen').classList.remove('hidden');
        
        let titles = {
            dates: "Раздел 1. События и даты",
            people: "Раздел 2. Деяния и личности",
            facts: "Раздел 3. Процессы и факты",
            geo: "Раздел 4. Описания и географические объекты"
        };
        document.getElementById('test-title').innerText = titles[mode];
        
        totalDigits = 0;
        correctDigits = 0;
        document.getElementById('accuracy-counter').innerText = '0%';
        document.getElementById('accuracy-counter').style.color = '#f87171';
        
        // Инструкция адаптирована под 8 элементов (А-И) и (1-8)
        document.querySelector('#test-screen p').innerText = "Сопоставьте элементы левой колонки (А-И) с элементами правой колонки (1-8). Введите цифры по порядку без пробелов.";
        document.getElementById('user-answer').maxLength = 8; // Ограничение в 8 символов
        document.getElementById('user-answer').placeholder = ". . . . . . . ."; // Восемь точек
        
        generateQuestion();
    }

    function toMainMenu() {
        document.getElementById('test-screen').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function generateQuestion() {
        document.getElementById('user-answer').value = '';
        document.getElementById('user-answer').disabled = false;
        document.getElementById('user-answer').style.borderColor = 'var(--border-color)';
        document.getElementById('result').classList.add('hidden');
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');

        let pool = [...db[currentMode]];
        if (pool.length < 8) return; // Проверка, что элементов в базе хватает на 8 строк

        let selected = [];
        // Набираем 8 уникальных элементов
        while(selected.length < 8) {
            let randIndex = Math.floor(Math.random() * pool.length);
            let item = pool[randIndex];
            if(!selected.some(s => s.right.trim() === item.right.trim())) {
                selected.push(item);
                pool.splice(randIndex, 1);
            }
        }

        let rightColumn = selected.map((item, index) => ({ text: item.right, originalIndex: index }));
        shuffle(rightColumn);

        let answers = [];
        // Формируем правильный ответ из 8 цифр
        for (let i = 0; i < 8; i++) {
            let correctPos = rightColumn.findIndex(item => item.originalIndex === i);
            answers.push(correctPos + 1);
        }
        currentCorrectAnswer = answers.join('');

        let html = '';
        // Генерируем 8 строк таблицы
        for (let i = 0; i < 8; i++) {
            let displayText = selected[i].left;
            
            // ПОДДОЧЕНО: Теперь разделение по ";" работает для ВСЕХ режимов (dates, facts, geo, people)
            let factsArray = displayText.split(';').map(f => f.trim()).filter(f => f.length > 0);
            if (factsArray.length > 0) {
                let randomFactIndex = Math.floor(Math.random() * factsArray.length);
                displayText = factsArray[randomFactIndex];
                // Делаем первую букву заглавной, если после деления она оказалась строчной
                displayText = displayText.charAt(0).toUpperCase() + displayText.slice(1);
            }

            html += `
                <tr>
                    <td class="col-num">${letters[i]}</td>
                    <td>${displayText}</td>
                    <td class="col-num">${i + 1}</td>
                    <td class="clickable-right" data-num="${i + 1}" onclick="appendNumber(${i + 1})" style="cursor: pointer;">${rightColumn[i].text}</td>
                </tr>
            `;
        }
        document.getElementById('table-body').innerHTML = html;
    }

    function checkAnswer() {
        let userAns = document.getElementById('user-answer').value.trim();
        let resultBox = document.getElementById('result');
        let inputField = document.getElementById('user-answer');

        // Проверяем, что введено ровно 8 цифр
        if (userAns.length !== 8 || isNaN(userAns)) {
            alert('Пожалуйста, введите 8 цифр соответствия без пробелов (например: 12345678)');
            return;
        }

        resultBox.classList.remove('hidden');
        inputField.disabled = true;

        // Счетчик процентов адаптирован под 8 цифр за один раунд
        for (let i = 0; i < 8; i++) {
            totalDigits++;
            if (userAns[i] === currentCorrectAnswer[i]) {
                correctDigits++;
            }
        }

        let percentage = Math.round((correctDigits / totalDigits) * 100);
        let counterEl = document.getElementById('accuracy-counter');
        counterEl.innerText = `${percentage}%`;

        if (percentage < 50) { counterEl.style.color = '#f87171'; } 
        else if (percentage < 75) { counterEl.style.color = '#fb923c'; } 
        else if (percentage < 80) { counterEl.style.color = '#facc15'; } 
        else if (percentage < 90) { counterEl.style.color = '#4ade80'; } 
        else if (percentage < 100) { counterEl.style.color = '#0aa370'; } 
        else { counterEl.style.color = '#38bdf8'; }

        if (userAns === currentCorrectAnswer) {
            resultBox.className = "result-box correct-ans";
            resultBox.innerText = "Правильно! Великолепно.";
            inputField.style.borderColor = "var(--correct-color)";
        } else {
            resultBox.className = "result-box wrong-ans";
            resultBox.innerText = `Неверно. Правильный ответ: ${currentCorrectAnswer}`;
            inputField.style.borderColor = "var(--wrong-color)";
        }

        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    // Функция добавления цифр при клике на правую колонку
    function appendNumber(num) {
        let inputField = document.getElementById('user-answer');
        if (inputField.disabled) return;
        
        // Лимит ввода увеличен до 8 символов
        if (inputField.value.length < 8) {
            inputField.value += num;
        }
    }
</script>
