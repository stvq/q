            background:

            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h1, h2 {
            text-align: center;
            color: #fff;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            background-color: #242428;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-hover);
        }

        .hidden {
            display: none !important;
        }

        .nav-btn {
            background-color: #242428;
            margin-bottom: 20px;
            padding: 8px 15px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #202024;
            color: #fff;
        }

        .col-num {
            width: 40px;
            text-align: center;
            font-weight: bold;
            background-color: #202024;
        }

        .interactive-zone {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap; /* Чтобы на смартфонах элементы не сжимались, а переносились */
        }

        input[type="text"] {
            background-color: #202024;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 6px;
            letter-spacing: 4px;
            text-align: left;
            width: 150px;
            outline: none;
            box-sizing: border-box;
            height: 48px; /* Одинаковая высота для инпута и кнопок */
        }

        input[type="text"]:focus {
            border-color: var(--accent-hover);
        }

            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;

            color: var(--correct-color);
            background-color: var(--correct-bg);

            color: var(--wrong-color);
            background-color: var(--wrong-bg);
            border: 1px solid var(--wrong-color);

            background-color: var(--accent-color);
            color: #fff;
            padding: 0 30px;
            font-weight: bold;
            height: 48px; /* Одинаковая высота для инпута и кнопок */
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }
/* Обновленная интерактивная зона с поддержкой адаптивности */
.interactive-zone {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-top: 20px;
    flex-wrap: nowrap; /* Гарантирует, что инпут и кнопка останутся в один ряд */
}

/* Адаптивность для мобильных устройств */
@media screen and (max-width: 600px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 15px;
        border-radius: 8px;
    }

    h1 {
        font-size: 22px;
    }

    h2 {
        font-size: 18px;
    }

    table {
        font-size: 13px;
        margin: 15px 0;
    }

    th, td {
        padding: 8px 6px;
    }

    .col-num {
        width: 30px;
    }

    /* Делаем кнопки меню на главном экране в одну колонку на маленьких телефонах */
    .menu {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    /* Оптимизация инпута и кнопок под узкие экраны */
    input[type="text"] {
        width: 100px; /* Немного сужаем поле ввода */
        font-size: 16px;
        padding: 12px 10px;
        letter-spacing: 2px;
    }

    .action-btn {
        padding: 0 20px;
        font-size: 14px;
        flex-grow: 1; /* Кнопка займет все оставшееся в ряду место */
    }
}
/* Стили для счетчика правильных ответов */
        .score-counter {

        .clickable-right:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
    </style>

    let currentMode = '';
    let currentCorrectAnswer = '';
    let totalDigits = 0;
    let correctDigits = 0;
    const letters = ['А', 'Б', 'В', 'Г'];

    function startTest(mode) {
        currentMode = mode;
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('test-screen').classList.remove('hidden');
        
        let titles = {
            dates: "Раздел 1. События и даты",
            people: "Раздел 2. Деяния и личности",
            facts: "Раздел 3. Процессы и факты",
            geo: "Раздел 4. Описания и географические объекты"
        };
        document.getElementById('test-title').innerText = titles[mode];
        
        // Сбрасываем счетчики при начале нового теста (по желанию)
        totalDigits = 0;
        correctDigits = 0;
        document.getElementById('accuracy-counter').innerText = '0%';
        document.getElementById('accuracy-counter').style.color = '#f87171';
        
        generateQuestion();
    }

    function toMainMenu() {
        document.getElementById('test-screen').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function generateQuestion() {
        document.getElementById('user-answer').value = '';
        document.getElementById('user-answer').disabled = false;
        document.getElementById('user-answer').style.borderColor = 'var(--border-color)';
        document.getElementById('result').classList.add('hidden');
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');

        let pool = [...db[currentMode]];
        if (pool.length < 4) return;

        let selected = [];
        while(selected.length < 4) {
            let randIndex = Math.floor(Math.random() * pool.length);
            let item = pool[randIndex];
            if(!selected.some(s => s.left.trim() === item.left.trim())) {
                selected.push(item);
                pool.splice(randIndex, 1);
            }
        }

        // Создаем правую колонку со случайным порядком
        let rightColumn = selected.map((item, index) => ({ text: item.right, originalIndex: index }));
        shuffle(rightColumn);

        // ИСПРАВЛЕНО: Восстанавливаем генерацию строки правильного ответа
        // Ищем, на каком месте (1-4) оказался оригинальный вариант для каждого пункта А, Б, В, Г
        let answers = [];
        for (let i = 0; i < 4; i++) {
            let correctPos = rightColumn.findIndex(item => item.originalIndex === i);
            answers.push(correctPos + 1); // Позиция от 1 до 4
        }
        currentCorrectAnswer = answers.join('');

        let html = '';
        for (let i = 0; i < 4; i++) {
            html += `
                <tr>
                    <td class="col-num">${letters[i]}</td>
                    <td>${selected[i].left}</td>
                    <td class="col-num">${i + 1}</td>
                    <td class="clickable-right" data-num="${i + 1}" onclick="appendNumber(${i + 1})" style="cursor: pointer;">${rightColumn[i].text}</td>
                </tr>
            `;
        }
        document.getElementById('table-body').innerHTML = html;
    }

    function checkAnswer() {
        let userAns = document.getElementById('user-answer').value.trim();
        let resultBox = document.getElementById('result');
        let inputField = document.getElementById('user-answer');

        if (userAns.length !== 4 || isNaN(userAns)) {
            alert('Пожалуйста, введите 4 цифры соответствия без пробелов (например: 1234)');
            return;
        }

        resultBox.classList.remove('hidden');
        inputField.disabled = true;

        // Посимвольная проверка (поциферно)
        for (let i = 0; i < 4; i++) {
            totalDigits++;
            if (userAns[i] === currentCorrectAnswer[i]) {
                correctDigits++;
            }
        }

        // Расчет процента и обновление счетчика
        let percentage = Math.round((correctDigits / totalDigits) * 100);
        let counterEl = document.getElementById('accuracy-counter');
        counterEl.innerText = `${percentage}%`;

        // Определение цвета в зависимости от успешности
        if (percentage < 50) {
            counterEl.style.color = '#f87171'; // Пастельный красный
        } else if (percentage < 75) {
            counterEl.style.color = '#fb923c'; // Оранжевый
        } else if (percentage < 80) {
            counterEl.style.color = '#facc15'; // Желтый
        } else if (percentage < 90) {
            counterEl.style.color = '#4ade80'; // Зеленый
        } else if (percentage < 100) {
            counterEl.style.color = '#0aa370'; // Насыщенный темно-зеленый с синевой
        } else {
            counterEl.style.color = '#38bdf8'; // Голубой (при ровно 100%)
        }

        if (userAns === currentCorrectAnswer) {
            resultBox.className = "result-box correct-ans";
            resultBox.innerText = "Правильно! Великолепно.";
            inputField.style.borderColor = "var(--correct-color)";
        } else {
            resultBox.className = "result-box wrong-ans";
            resultBox.innerText = `Неверно. Правильный ответ: ${currentCorrectAnswer}`;
            inputField.style.borderColor = "var(--wrong-color)";
        }

        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    document.getElementById('user-answer').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            if (!document.getElementById('submit-btn').classList.contains('hidden')) {
                checkAnswer();
            } else {
                generateQuestion();
            }
        }
    });

    function appendNumber(num) {
        let inputField = document.getElementById('user-answer');
        
        // Если поле заблокировано (уже проверили ответ), ничего не делаем
        if (inputField.disabled) return;
        
        // Если уже введено 4 цифры, не добавляем новые
        if (inputField.value.length < 4) {
            inputField.value += num;
        }
    }
</script>
